version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/bytecode
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_here}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your_jwt_refresh_secret_key_here}
      - JWT_EXPIRE=10d
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:5000}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:5173}
      - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL:-http://email-service:5001}
    depends_on:
      - mongodb
      - redis
      - email-service
    restart: unless-stopped

  email-service:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    ports:
      - "${EMAIL_SERVICE_PORT:-5001}:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - EMAIL_SERVICE=${EMAIL_SERVICE:-gmail}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-"ByteCode Auth"}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: bytecode-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bytecode-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo-data:
